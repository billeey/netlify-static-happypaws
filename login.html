<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Login - HappyPaws</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">

<!-- navbar -->
<nav class="navbar navbar-expand-lg navbar header-blue shadow custom-blue">
  <div class="container">
    <a class="navbar-brand fw-bold text-white text-decoration-none" href="index.html">
      🐾 HappyPaws
    </a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
        <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- form untuk login -->
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-4">

      <div class="card shadow">
        <div class="card-body">
          <h3 class="text-center mb-4">Login</h3>

          <form id="contactForm">
            <div class="mb-3">
              <input type="email" class="form-control" placeholder="Email">
            </div>
            <div class="mb-3">
              <input type="password" class="form-control" placeholder="Password">
            </div>
            <button class="btn btn-dark w-100 btn-cream ">Login</button>
          </form>

          <p class="text-center mt-3">
            Don't have an account? <a href="#">Register</a>
          </p>
        </div>
      </div>

    </div>
  </div>
</div>
<script>
  document.getElementById("contactForm").addEventListener("submit", function(event) {
    // Agar halaman tidak ter reload
    event.preventDefault(); 
    alert("Message sent successfully! 🐾");
    // Reset form setelah kirim
    this.reset(); 
  });
</script>
</body>
</html>
