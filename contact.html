<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Contact Us - HappyPaws</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- navbar -->
<nav class="navbar navbar-expand-lg navbar-dark custom-blue">
  <div class="container">
    <a class="navbar-brand fw-bold text-white" href="index.html">
      🐾 HappyPaws
    </a>
    <div class="collapse navbar-collapse show">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
        <li class="nav-item"><a class="nav-link active" href="gallery.html">Gallery</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
      </ul>
    </div>
  </div>
</nav>

<section class="container mt-5">
  <h1 class="text-center mb-4">Contact Us</h1>

  <form id="contactForm">
    <div class="mb-3">
      <label class="form-label">Name</label>
      <input type="text" class="form-control">
    </div>

    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control">
    </div>

    <div class="mb-3">
      <label class="form-label">Pet Type</label>
      <select class="form-select">
        <option>Dog</option>
        <option>Cat</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Message</label>
      <textarea class="form-control"></textarea>
    </div>

    <button type="submit" class="btn btn-cream">
        Send Message
    </button>
  </form>
</section>

<footer class="custom-blue text-white text-center p-3 mt-5">
  <p>© 2026 HappyPaws Grooming | Billy Ananda</p>
</footer>

<script>
  document.getElementById("contactForm").addEventListener("submit", function(event) {
    // Agar halaman tidak ter reload
    event.preventDefault(); 
    alert("Message sent successfully! 🐾");
    // Reset form setelah kirim
    this.reset(); 
  });
</script>
</body>
</html>
